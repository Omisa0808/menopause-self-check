          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
            <span style={{ fontSize:12, fontWeight:800 }}>🦘 {label}</span>
            <span style={{ fontSize:12, fontWeight:900, color:'var(--mint-deep)', background:'var(--mint-soft)', padding:'3px 10px', borderRadius:99 }}>
              {done} / {total} 問
            </span>
          </div>
          <div className="prog-track"><div className="prog-fill" style={{ width:`${Math.round(done / total * 100)}%` }} /></div>
        </div>
      );
    }

    function Footer() {
      return (
        <div style={{ textAlign:'center', fontSize:10.5, color:'var(--gray)', lineHeight:1.7, fontWeight:600, padding:'14px 8px 8px' }}>
          🦘 監修：おなかカンガルー（薬剤師）<br />
          このチェックは医療診断ではありません。<br />
          気になる症状は医療機関にご相談ください。
        </div>
      );
    }

    /* ---------------- 結果 ---------------- */
    function ResultsView({ answers, onBack, onRestart }) {
      // タイプごとに質問数が違うので、割合で比べる
      const typeResults = TYPES.map(t => {
        const score = typeScore(t, answers);
        const max = t.items.length * 2;
        return { ...t, score, max, ratio: score / max };
      });
      const top = Math.max(...typeResults.map(r => r.ratio));
      const primaries = top > 0 ? typeResults.filter(r => Math.abs(r.ratio - top) < 1e-9) : [];
      const moodHigh = answers['B6'] === 2;

      const foodResults = FOOD_GROUPS
        .map(g => ({ ...g, avg: groupScore(g, answers) }))
        .filter(g => g.avg !== null && g.avg >= 0.5)
        .sort((a, b) => b.avg - a.avg)
        .slice(0, 2);

      const shareUrl = typeof window !== 'undefined' ? window.location.href : '';

      return (
        <div className="wrap">
          <div style={{ marginTop:18 }} />
          <Hero title={<>結果がでたよ〜！🎉</>} sub="あなたのガス腹のタイプと、張りやすいかもしれない食材です" />

          {primaries.length === 0 ? (
            <div className="pop-card" style={{ padding:20 }}>
              <div style={{ fontSize:16, fontWeight:900, marginBottom:8 }}>🌿 今のところ、ガス腹さんではなさそう！</div>
              <div style={{ fontSize:13, lineHeight:1.7, fontWeight:600 }}>
                どのタイプにもほとんど当てはまりませんでした。この調子でいこうね。気になる日が出てきたら、またやってみてね。
              </div>
            </div>
          ) : primaries.map(p => (
            <div key={p.id} style={{
              background:`linear-gradient(135deg, ${p.color.soft} 0%, ${p.color.light} 100%)`,
              border:`3px solid ${p.color.primary}`, borderRadius:24, padding:20, marginBottom:18,
              boxShadow:`0 5px 0 ${p.color.primary}33`, position:'relative', overflow:'hidden',
            }}>
              <span className="twinkle" style={{ position:'absolute', top:10, right:14, fontSize:20 }}>✨</span>
              <div style={{ fontSize:11, fontWeight:800, color: p.color.deep, letterSpacing:'0.05em', marginBottom:4 }}>
                🎯 あなたのガス腹タイプ{primaries.length > 1 ? '（同点で2つ以上）' : ''}
              </div>
              <div style={{ fontSize:23, fontWeight:900, color: p.color.deep, lineHeight:1.3, marginBottom:10, display:'flex', alignItems:'center', gap:8 }}>
                <span style={{ fontSize:28 }}>{p.emoji}</span>{p.name}
              </div>
              {p.mine && (
                <div style={{
                  display:'inline-block', fontSize:11.5, fontWeight:800, color:'white',
                  background: p.color.deep, padding:'4px 12px', borderRadius:99, marginBottom:10,
                }}>🦘 私もこれでした！</div>
              )}
              <div style={{ fontSize:13.5, lineHeight:1.7, fontWeight:600, marginBottom:12 }}>{p.desc}</div>
              <div style={{ background:'white', borderRadius:14, padding:'12px 14px', border:`2px dashed ${p.color.primary}` }}>
                <div style={{ fontSize:11.5, fontWeight:800, color: p.color.deep, marginBottom:5 }}>🌱 今日からできる1つ</div>
                <div style={{ fontSize:13.5, lineHeight:1.65, fontWeight:600 }}>{p.todo}</div>
              </div>
            </div>
          ))}

          {moodHigh && (
            <div style={{
              background:'#f5f3ff', border:'2.5px solid #a78bfa', borderRadius:18,
              padding:'14px 16px', marginBottom:18, fontSize:12.5, lineHeight:1.75, fontWeight:600,
            }}>
              💜 気分の落ち込みや不安が「よくある」と答えてくれたあなたへ。<br />
              2週間以上続いている、眠れない日が続く、毎日がつらいと感じるときは、ひとりで抱えずに、かかりつけ医や心療内科に相談してね。お腹のケアと一緒に進めて大丈夫だよ。
            </div>
          )}

          {/* 5タイプの点数 */}
          <div className="pop-card" style={{ padding:20 }}>
            <div style={{ fontSize:14, fontWeight:900, marginBottom:14 }}>📊 5タイプの当てはまり度</div>
            {typeResults.map(r => (
              <div key={r.id} style={{ marginBottom:12 }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:5 }}>
                  <span style={{ fontSize:13, fontWeight:800 }}><span style={{ fontSize:15 }}>{r.emoji}</span> {r.name}</span>
                  <span style={{ fontSize:13, fontWeight:900, color: r.color.deep }}>{r.score} / {r.max}</span>
                </div>
                <div className="rbar-track">
                  <div className="rbar-fill" style={{ width:`${r.score / r.max * 100}%`, background:`linear-gradient(90deg, ${r.color.primary}, ${r.color.deep})` }} />
                </div>
              </div>
            ))}
          </div>

          {/* 食材 */}
          <div className="pop-card" style={{ padding:20 }}>
            <div style={{ fontSize:14, fontWeight:900, marginBottom:10 }}>🍽️ あなたが張りやすいかもしれない食材</div>
            {foodResults.length === 0 ? (
              <div style={{ fontSize:13, lineHeight:1.7, fontWeight:600, marginBottom:10 }}>
                今回のチェックでは、とくに目立つ食材グループはありませんでした。
              </div>
            ) : foodResults.map(g => (
              <div key={g.id} style={{ background:'#fffaf0', border:'2px solid #fff4c1', borderRadius:16, padding:'12px 14px', marginBottom:10 }}>
                <div style={{ fontSize:14, fontWeight:900, marginBottom:4 }}>{g.emoji} {g.name}</div>
                <div style={{ fontSize:11.5, color:'var(--gray)', fontWeight:700, marginBottom:6 }}>
                  {g.items.map(it => it.t).join('／')}
                </div>
                <div style={{ fontSize:13, lineHeight:1.65, fontWeight:600 }}>{g.tip}</div>
              </div>
            ))}
            <div style={{ fontSize:12.5, lineHeight:1.7, fontWeight:700, color:'var(--mint-deep)', background:'var(--mint-soft)', borderRadius:12, padding:'10px 12px' }}>
              全部やめなくて大丈夫。腸の住人のエサでもあるから、量とタイミングで調整するのがコツ。続けて張るなら、3日メモして部屋で相談してね。
            </div>
          </div>

          {/* 部屋への案内 */}
          <div style={{
            background:'linear-gradient(135deg, #ecfdf5 0%, #ccf7eb 100%)', border:'3px solid var(--mint)',
            borderRadius:24, padding:20, marginBottom:14, boxShadow:'0 5px 0 #5ed4b855',
          }}>
            <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:12 }}>
              <img src="../assets/kangaroo.png" alt="" className="wobble" style={{ width:60, height:60, flexShrink:0, objectFit:'contain' }} />
              <div style={{ fontSize:14, fontWeight:900, lineHeight:1.5 }}>
                ガス腹は、体質だからって<br />あきらめるものじゃないの。
              </div>
            </div>
            <div style={{ fontSize:13, lineHeight:1.75, fontWeight:600, marginBottom:14 }}>
              腸内を知る → 腸を育てる → 食べ方 → 動き方。<br />
              あなたのタイプに合った順番の続きは「ととのえ実験室」で。<br />
              部屋にいる人は、結果のスクショやタイプ名を書き込んでね🌿
            </div>
            <a href={ROOM_URL} target="_blank" rel="noopener noreferrer" style={{
              display:'block', textAlign:'center', padding:'15px 16px',
              background:'linear-gradient(135deg, #5ed4b8 0%, #10b981 100%)', color:'white',
              fontSize:15, fontWeight:900, borderRadius:99, textDecoration:'none', boxShadow:'0 5px 0 #047857',
            }}>
              🌿 まだの人は「ととのえ実験室」へ（匿名・見るだけOK）
            </a>
          </div>

          {/* シェア */}
          <div className="pop-card" style={{ padding:16 }}>
            <div style={{ fontSize:12, fontWeight:800, marginBottom:10, textAlign:'center' }}>🦘 ガス腹仲間にも教えてあげてね</div>
            <div style={{ display:'flex', gap:8 }}>
              <a
                href={`https://line.me/R/msg/text/?${encodeURIComponent(SHARE_TEXT + '\n' + shareUrl)}`}
                target="_blank" rel="noopener noreferrer"
                style={{ flex:1, textAlign:'center', padding:'13px 8px', background:'#06c755', color:'white', fontSize:13, fontWeight:900, borderRadius:99, textDecoration:'none', boxShadow:'0 3px 0 #058842' }}
              >💬 LINEで送る</a>
              <button
                onClick={() => {
                  if (navigator.share) navigator.share({ title:'ガス腹原因特定アプリ', text: SHARE_TEXT, url: shareUrl }).catch(()=>{});
                  else if (navigator.clipboard) navigator.clipboard.writeText(shareUrl);
                }}
                style={{ flex:1, padding:'13px 8px', border:'none', background:'var(--purple)', color:'white', fontFamily:'inherit', fontSize:13, fontWeight:900, borderRadius:99, cursor:'pointer', boxShadow:'0 3px 0 #6d28d9' }}
              >🔗 リンクをコピー</button>
            </div>
          </div>

          <button className="sub-btn" onClick={onBack}>← 答えを見直す</button>
          <button className="sub-btn" onClick={onRestart}>🔄 最初からやり直す</button>
          <Footer />
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /*  APP                                                                 */
    /* ------------------------------------------------------------------ */
    function App() {
      const [answers, setAnswers] = useState(() => {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
        catch (e) { return {}; }
      });
      const [page, setPage] = useState('A');

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(answers)); } catch (e) {}
      }, [answers]);

      const go = p => { setPage(p); window.scrollTo({ top:0, behavior:'smooth' }); };
      const handleSelect = (id, v) => setAnswers(prev => ({ ...prev, [id]: v }));
      const restart = () => { setAnswers({}); go('A'); };

      const doneA = allItemsA.filter(it => answers[it.id] !== undefined).length;
      const doneB = allItemsB.filter(it => answers[it.id] !== undefined).length;

      if (page === 'result') return <ResultsView answers={answers} onBack={() => go('B')} onRestart={restart} />;

      if (page === 'B') {
        return (
          <div className="wrap">
            <div style={{ marginTop:18 }} />
            <Hero title={<>パート2<br />食材チェック</>} sub="食べたあとにお腹が張るか、選んでね。食べないものは「食べない」でOK" />
            <ProgressBar done={doneB} total={allItemsB.length} label="パート2の進み具合" />
            <QuestionCard
              label="食材ごとに答えてね" emoji="🍽️"
              items={allItemsB} answers={answers} onSelect={handleSelect}
              color={{ primary:'#ffd93d', light:'#fff4c1', deep:'#a16207', soft:'#fffbeb' }}
              opts={OPTS_B}
            />
            <button className="sub-btn" onClick={() => go('A')}>← パート1に戻る</button>
            <Footer />
            <div className="bottom-area"><div className="bottom-inner">
              <button className="main-btn" onClick={() => go('result')}>
                {doneB === allItemsB.length ? '🎯 結果を見る！' : `🎯 結果を見る（残り ${allItemsB.length - doneB} 問）`}
              </button>
            </div></div>
          </div>
        );
      }

      return (
        <div className="wrap">
          <div style={{
            display:'flex', alignItems:'center', justifyContent:'center', gap:6,
            background:'linear-gradient(90deg, #5ed4b8, #10b981)', color:'white', fontWeight:900, fontSize:12,
            padding:'9px 14px', borderRadius:99, marginTop:18, marginBottom:10, boxShadow:'0 4px 0 #047857',
          }}>
            🎁 ととのえ実験室 参加プレゼント
          </div>
          <Hero title={<>ガス腹<br />原因特定アプリ</>} sub="ガス腹を卒業した薬剤師がつくった、5分のセルフチェック。最近1か月のお腹で答えてね" />
          <RedFlagBox />
          <ProgressBar done={doneA} total={allItemsA.length} label="パート1の進み具合" />
          {TYPES.map((t, i) => (
            <QuestionCard
              key={t.id} label={`質問グループ ${i + 1}`} emoji="🦘"
              items={t.items} answers={answers} onSelect={handleSelect} color={t.color} opts={OPTS_A}
            />
          ))}
          <Footer />
          <div className="bottom-area"><div className="bottom-inner">
            <button className="main-btn" onClick={() => go('B')}>
              {doneA === allItemsA.length ? '次へ：パート2 食材チェック →' : `次へ（残り ${allItemsA.length - doneA} 問）→`}
            </button>
          </div></div>
        </div>
      );
    }

    document.getElementById('loading').style.display = 'none';
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
